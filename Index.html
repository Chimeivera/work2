<!doctype html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta name="theme-color" content="#65558f">
  <style>
    :root{--ink:#282431;--muted:#746d7c;--purple:#65558f;--purple2:#8b79b2;--lav:#f2eef9;--cream:#fffaf3;--white:#fff;--red:#b94b5f;--line:#e7e0ed;--shadow:0 8px 26px rgba(67,48,88,.11)}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(145deg,#faf7fd 0,#fffaf3 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit} button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:26px 18px 90px}
    header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.brand{display:flex;align-items:center;gap:13px}.logo{width:50px;height:50px;border-radius:16px;background:var(--purple);color:white;display:grid;place-items:center;font-size:25px;box-shadow:var(--shadow)}
    h1{font-size:24px;margin:0} .subtitle{color:var(--muted);font-size:14px;margin-top:4px}.top-actions{display:flex;gap:9px}
    .btn{border:0;border-radius:12px;padding:10px 15px;font-weight:700;background:white;color:var(--ink);box-shadow:0 2px 9px rgba(0,0,0,.06)}.btn.primary{background:var(--purple);color:white}.btn.danger{color:var(--red);background:#fff3f5}.btn:disabled{opacity:.55;cursor:wait}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:rgba(255,255,255,.88);border:1px solid white;border-radius:17px;padding:15px;box-shadow:var(--shadow)}.stat b{font-size:25px;display:block;color:var(--purple)}.stat span{font-size:13px;color:var(--muted)}
    .toolbar{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px;background:white;padding:12px;border-radius:17px;box-shadow:var(--shadow);margin-bottom:18px}.field{border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;background:white;color:var(--ink)}
    .list{display:grid;gap:12px}.card{background:rgba(255,255,255,.94);border:1px solid white;border-radius:18px;padding:17px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:14px}.card h3{margin:7px 0 7px;font-size:18px}.card p{white-space:pre-wrap;margin:0;color:#554e5c;line-height:1.55}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--lav);color:var(--purple)}.chip.urgent{background:#fff0f2;color:#b23f54}.chip.done{background:#e9f7ef;color:#28784a}.meta{color:var(--muted);font-size:12px;margin-top:12px}.card-actions{display:flex;gap:7px;align-items:start}.icon-btn{border:0;background:var(--lav);color:var(--purple);border-radius:10px;padding:8px 10px;font-weight:700}
    .empty{text-align:center;padding:65px 15px;color:var(--muted)}.empty .emoji{font-size:42px;margin-bottom:9px}.loading{position:fixed;inset:0;background:rgba(255,255,255,.65);display:none;place-items:center;z-index:20}.loading.show{display:grid}.spinner{width:42px;height:42px;border:4px solid #ded5eb;border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    dialog{border:0;border-radius:22px;padding:0;width:min(610px,calc(100% - 26px));box-shadow:0 24px 80px rgba(48,34,60,.3)}dialog::backdrop{background:rgba(32,24,39,.48)}.modal{padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0}.close{border:0;background:none;font-size:26px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.modal textarea{min-height:125px;resize:vertical}.modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.right{display:flex;gap:9px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:#332c3b;color:white;padding:11px 18px;border-radius:12px;box-shadow:var(--shadow);transition:.25s;z-index:30}.toast.show{transform:translate(-50%,0)}
    @media(max-width:720px){.shell{padding:18px 12px 90px}header{align-items:flex-start}.top-actions .sheet{display:none}.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.card{grid-template-columns:1fr}.card-actions{justify-content:flex-end}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:21px}.logo{width:44px;height:44px}.btn{padding:10px 12px}}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div class="spinner"></div></div>
  <main class="shell">
    <header><div class="brand"><div class="logo">☑</div><div><h1>主管會議報告箱</h1><div class="subtitle">想到就記，開會前不再漏掉重要事項</div></div></div><div class="top-actions"><button class="btn sheet" onclick="openSheet()">開啟資料表</button><button class="btn primary" onclick="openForm()">＋ 新增事項</button></div></header>
    <section class="stats"><div class="stat"><b id="sAll">0</b><span>全部事項</span></div><div class="stat"><b id="sTodo">0</b><span>待整理</span></div><div class="stat"><b id="sPlan">0</b><span>已排入</span></div><div class="stat"><b id="sDone">0</b><span>已報告</span></div></section>
    <section class="toolbar"><input id="search" class="field search" placeholder="搜尋主旨或說明…" oninput="render()"><select id="meetingFilter" class="field" onchange="render()"><option value="">全部會議</option></select><select id="statusFilter" class="field" onchange="render()"><option value="">全部狀態</option><option>待整理</option><option>已排入</option><option>已報告</option><option>暫緩</option></select><button class="btn" onclick="clearFilters()">清除</button></section>
    <section class="list" id="list"></section>
  </main>
  <dialog id="dialog"><form class="modal" id="form" onsubmit="submitForm(event)"><div class="modal-head"><h2 id="formTitle">新增報告事項</h2><button type="button" class="close" onclick="closeForm()">×</button></div><input type="hidden" id="id"><div class="form-grid">
    <div><label for="meeting">會議 *</label><select class="field" id="meeting" required></select></div><div><label for="reportDate">預計報告日</label><input class="field" type="date" id="reportDate"></div>
    <div class="full"><label for="title">報告主旨 *</label><input class="field" id="title" maxlength="150" required placeholder="一句話記下重點"></div>
    <div class="full"><label for="details">內容／要請主管決定什麼</label><textarea class="field" id="details" maxlength="5000" placeholder="可先隨手記，之後再補充背景、數據與建議…"></textarea></div>
    <div><label for="priority">優先度</label><select class="field" id="priority"><option>一般</option><option>重要</option><option>緊急</option></select></div><div><label for="status">狀態</label><select class="field" id="status"><option>待整理</option><option>已排入</option><option>已報告</option><option>暫緩</option></select></div>
  </div><div class="modal-actions"><button type="button" class="btn danger" id="deleteBtn" onclick="removeCurrent()" style="visibility:hidden">刪除</button><div class="right"><button type="button" class="btn" onclick="closeForm()">取消</button><button class="btn primary" id="saveBtn">儲存</button></div></div></form></dialog>
  <div class="toast" id="toast"></div>
<script>
  const MEETINGS=['醫務會議','醫學教育委員會','教學會議','行政主管協調會','院務會議'];let items=[];
  document.addEventListener('DOMContentLoaded',()=>{['meeting','meetingFilter'].forEach(id=>{const el=document.getElementById(id);MEETINGS.forEach(x=>el.add(new Option(x,x)))});load()});
  function server(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)))[fn](...args))}
  async function load(){busy(true);try{items=await server('getItems');render()}catch(e){notify(e.message)}finally{busy(false)}}
  function render(){const q=document.getElementById('search').value.trim().toLowerCase(),m=document.getElementById('meetingFilter').value,s=document.getElementById('statusFilter').value;const shown=items.filter(x=>(!m||x.meeting===m)&&(!s||x.status===s)&&(!q||(x.title+' '+x.details).toLowerCase().includes(q)));document.getElementById('sAll').textContent=items.length;document.getElementById('sTodo').textContent=items.filter(x=>x.status==='待整理').length;document.getElementById('sPlan').textContent=items.filter(x=>x.status==='已排入').length;document.getElementById('sDone').textContent=items.filter(x=>x.status==='已報告').length;const list=document.getElementById('list');if(!shown.length){list.innerHTML='<div class="empty"><div class="emoji">🗂️</div><b>目前沒有符合的事項</b><div>想到事情時，就先新增一筆吧！</div></div>';return}list.innerHTML=shown.map(x=>`<article class="card"><div><div class="chips"><span class="chip">${esc(x.meeting)}</span><span class="chip ${x.priority==='緊急'?'urgent':''}">${esc(x.priority)}</span><span class="chip ${x.status==='已報告'?'done':''}">${esc(x.status)}</span></div><h3>${esc(x.title)}</h3>${x.details?`<p>${esc(x.details)}</p>`:''}<div class="meta">${x.reportDate?'預計報告：'+dateText(x.reportDate)+'　·　':''}更新：${dateText(x.updatedAt)}</div></div><div class="card-actions"><button class="icon-btn" onclick="editItem('${x.id}')">編輯</button></div></article>`).join('')}
  function openForm(item){document.getElementById('form').reset();document.getElementById('id').value=item?.id||'';document.getElementById('formTitle').textContent=item?'編輯報告事項':'新增報告事項';['meeting','title','details','reportDate','priority','status'].forEach(k=>{if(item)document.getElementById(k).value=item[k]||''});if(!item){document.getElementById('meeting').value=MEETINGS[0];document.getElementById('priority').value='一般';document.getElementById('status').value='待整理'}document.getElementById('deleteBtn').style.visibility=item?'visible':'hidden';document.getElementById('dialog').showModal();setTimeout(()=>document.getElementById('title').focus(),100)}
  function closeForm(){document.getElementById('dialog').close()}function editItem(id){openForm(items.find(x=>x.id===id))}
  async function submitForm(e){e.preventDefault();const data={};['id','meeting','title','details','reportDate','priority','status'].forEach(k=>data[k]=document.getElementById(k).value);busy(true);try{await server('saveItem',data);closeForm();notify('已儲存');await load()}catch(err){notify(err.message)}finally{busy(false)}}
  async function removeCurrent(){const id=document.getElementById('id').value;if(!id||!confirm('確定刪除這筆事項？刪除後無法復原。'))return;busy(true);try{await server('deleteItem',id);closeForm();notify('已刪除');await load()}catch(e){notify(e.message)}finally{busy(false)}}
  async function openSheet(){busy(true);try{const url=await server('getSpreadsheetUrl');window.open(url,'_blank')}catch(e){notify(e.message)}finally{busy(false)}}
  function clearFilters(){document.getElementById('search').value='';document.getElementById('meetingFilter').value='';document.getElementById('statusFilter').value='';render()}function busy(v){document.getElementById('loading').classList.toggle('show',v)}function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}function dateText(v){if(!v)return'';const d=new Date(v);return isNaN(d)?v:new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}let toastTimer;function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
</script></body></html>
